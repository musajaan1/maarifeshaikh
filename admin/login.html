<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لاگ ان | معارف شیخ</title>
  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--parchment);
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-container h1 {
      color: var(--teal);
      margin-bottom: 2rem;
      font-size: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
      text-align: right;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--ink);
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }
    .btn-login {
      background: var(--gold);
      color: white;
      border: none;
      width: 100%;
      padding: 0.8rem;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-login:hover {
      background: var(--teal);
    }
    #errorMsg {
      color: red;
      margin-bottom: 1rem;
      display: none;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-left: 2.5rem; /* Space for the icon on the left (since RTL is active, actually we might want icon on left so padding-left is correct) */
    }
    .password-wrapper .toggle-password {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>ایڈمن لاگ ان</h1>
    <div id="errorMsg">پاس ورڈ غلط ہے۔</div>
    <form id="loginForm">
      <div class="form-group">
        <label>پاس ورڈ درج کریں:</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="••••••••" dir="ltr" style="text-align: left; font-family: sans-serif;">
          <i class="fas fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> لاگ ان کریں</button>
    </form>
  </div>

  <script>
    document.getElementById('togglePassword').addEventListener('click', function (e) {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        this.classList.remove('fa-eye');
        this.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        this.classList.remove('fa-eye-slash');
        this.classList.add('fa-eye');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/';
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'سرور سے رابطہ نہیں ہو سکا۔';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
